name: REDRUM Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/redrum/**"
      - ".github/workflows/redrum-android-build.yml"
  pull_request:
    paths:
      - "mobile/redrum/**"
      - ".github/workflows/redrum-android-build.yml"
  workflow_dispatch:
    inputs:
      versionName:
        description: "Override version name (e.g. 1.2.0). Leave empty to keep the one in build.gradle."
        required: false
        default: ""

jobs:
  build:
    name: Build REDRUM APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/redrum

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/redrum/package-lock.json

      - name: Install web/Capacitor dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Override version name
        if: ${{ github.event.inputs.versionName != '' }}
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ github.event.inputs.versionName }}\"/" android/app/build.gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/redrum/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (always installable, no signing setup required)
        run: ./gradlew assembleDebug
        working-directory: mobile/redrum/android

      - name: Build signed release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/redrum/android

      - name: Rename APKs for a clean artifact name
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/REDRUM-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/REDRUM-release.apk

      - name: Upload REDRUM APKs
        uses: actions/upload-artifact@v4
        with:
          name: redrum-apk
          path: mobile/redrum/dist/*.apk
          if-no-files-found: error
          retention-days: 30
